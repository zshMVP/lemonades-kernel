name: Build OnePlus 9R SukiSU Nova

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ARCH: arm64
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_oneplus_sm8250.git
      KERNEL_BRANCH: lineage-23.2
      KSU_REF: builtin
      CLANG_REV: 990fd16989111c09efdde72f8874bb30e2780db8

    steps:
      # 1. Install build dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git curl wget \
            build-essential \
            bc bison flex \
            libssl-dev libelf-dev \
            libncurses-dev \
            python3 python-is-python3 \
            rsync cpio \
            zip unzip \
            lz4 zstd \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libxml2-utils

      # 2. Clone OnePlus SM8250 kernel
      - name: Clone kernel source
        run: |
          git clone \
            --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" kernel

          cd kernel

          echo "===== Kernel version ====="
          head -n 6 Makefile

          grep -q 'SUBLEVEL = 325' Makefile

          echo "===== CIP / ST version ====="

          test -f localversion-cip
          test -f localversion-st

          cat localversion-cip
          cat localversion-st

          test -f arch/arm64/configs/vendor/kona-perf_defconfig
          test -f arch/arm64/configs/vendor/oplus.config

          echo "Kernel source verification passed."

      # 3. Install AOSP Clang 21
      - name: Download AOSP Clang
        shell: bash
        run: |
          set -euxo pipefail

          CLANG_DIR="$GITHUB_WORKSPACE/clang"
          CLANG_BIN="$CLANG_DIR/bin"

          mkdir -p "$CLANG_DIR"

          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_REV}/clang-r574158.tar.gz"

          echo "Downloading AOSP Clang r574158..."

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$URL" \
            -o "$RUNNER_TEMP/clang.tar.gz"

          echo "Checking archive..."

          test -s "$RUNNER_TEMP/clang.tar.gz"

          tar -tzf "$RUNNER_TEMP/clang.tar.gz" >/dev/null

          echo "Extracting..."

          tar -xzf "$RUNNER_TEMP/clang.tar.gz" \
            -C "$CLANG_DIR"

          # Important: update PATH immediately
          export PATH="$CLANG_BIN:$PATH"

          # Also expose it to subsequent Actions steps
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "===== Compiler location ====="

          which clang

          echo "===== Compiler version ====="

          "$CLANG_BIN/clang" --version

          echo "===== Verify compiler ====="

          "$CLANG_BIN/clang" --version \
            | grep -F "21.0.0"

          test -x "$CLANG_BIN/ld.lld"

          "$CLANG_BIN/ld.lld" --version

          echo "AOSP Clang r574158 installation successful!"

      # 4. Integrate SukiSU Nova builtin
      - name: Integrate SukiSU Nova
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          curl -fLSs \
            "https://git.zako.shirkneko.top:20004/shirkneko/SukiSU/raw/branch/main/kernel/setup.sh" \
            -o "$RUNNER_TEMP/sukisu-setup.sh"

          bash "$RUNNER_TEMP/sukisu-setup.sh" builtin

          test -e drivers/kernelsu

          echo "===== SukiSU source ====="

          ls -la drivers/kernelsu

          echo "===== Hook configuration ====="

          grep -R \
            "KSU_HACK_ARM64_BRANCH_LINK" \
            drivers/kernelsu \
            --include='Kconfig*' \
            --include='*.Kconfig' || true

      # 5. Configure kernel
      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          mkdir -p out

          make O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/kona-perf_defconfig

          scripts/kconfig/merge_config.sh \
            -m -O out \
            out/.config \
            arch/arm64/configs/vendor/oplus.config

          # Verify the SukiSU branch exposes the required ARM64 option.
          if ! grep -Rqs \
            "config KSU_HACK_ARM64_BRANCH_LINK" \
            drivers/kernelsu; then
            echo "ERROR: SukiSU builtin does not expose ARM64 branch-link option."
            echo "Manual hook patches must be adapted before building."
            exit 1
          fi

          cat > out/sukisu.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF

          scripts/kconfig/merge_config.sh \
            -m -O out \
            out/.config \
            out/sukisu.config

          make O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "===== Verify SukiSU ====="

          grep -E \
            'CONFIG_(KSU|KSU_HACK_ARM64_BRANCH_LINK|KSU_SUSFS|KSU_SUSFS_SUS_PATH|KSU_SUSFS_SUS_MOUNT|KALLSYMS)=' \
            out/.config || true

          grep -qx 'CONFIG_KSU=y' out/.config

          grep -qx \
            'CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y' \
            out/.config

          grep -qx 'CONFIG_KSU_SUSFS=y' out/.config

          echo "SukiSU configuration passed."

      # 6. Build kernel
      - name: Build kernel
        run: |
          cd kernel

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image dtbs

      # 7. Collect artifacts
      - name: Collect artifacts
        run: |
          cd kernel

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp out/arch/arm64/boot/Image \
            "$GITHUB_WORKSPACE/artifacts/Image"

          cp out/.config \
            "$GITHUB_WORKSPACE/artifacts/kernel.config"

          make -s O=out ARCH=arm64 kernelrelease \
            > "$GITHUB_WORKSPACE/artifacts/kernel-version.txt"

          git rev-parse HEAD \
            > "$GITHUB_WORKSPACE/artifacts/kernel-commit.txt"

          clang --version \
            > "$GITHUB_WORKSPACE/artifacts/clang-version.txt"

          tar -czf \
            "$GITHUB_WORKSPACE/artifacts/dtbs.tar.gz" \
            -C out/arch/arm64/boot/dts .

          cd "$GITHUB_WORKSPACE/artifacts"

          sha256sum Image > SHA256SUMS.txt

      # 8. Upload artifacts
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lemonades-SukiSU-Nova-4.19
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
