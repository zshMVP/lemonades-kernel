name: Build OnePlus 9R SukiSU Nova

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ARCH: arm64
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_oneplus_sm8250.git
      KERNEL_BRANCH: lineage-23.2
      KSU_REF: builtin
      CLANG_REV: 990fd16989111c09efdde72f8874bb30e2780db8

    steps:
      # 1. Install build dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git curl wget \
            build-essential \
            bc bison flex \
            libssl-dev libelf-dev \
            libncurses-dev \
            python3 python-is-python3 \
            rsync cpio \
            zip unzip \
            lz4 zstd \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libxml2-utils

      # 2. Clone OnePlus SM8250 kernel
      - name: Clone kernel source
        run: |
          git clone \
            --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" kernel

          cd kernel

          echo "===== Kernel version ====="
          head -n 6 Makefile

          grep -q 'SUBLEVEL = 325' Makefile

          echo "===== CIP / ST version ====="

          test -f localversion-cip
          test -f localversion-st

          cat localversion-cip
          cat localversion-st

          test -f arch/arm64/configs/vendor/kona-perf_defconfig
          test -f arch/arm64/configs/vendor/oplus.config

          echo "Kernel source verification passed."

      # 3. Install AOSP Clang 21
      - name: Download AOSP Clang
        shell: bash
        run: |
          set -euxo pipefail

          CLANG_DIR="$GITHUB_WORKSPACE/clang"
          CLANG_BIN="$CLANG_DIR/bin"

          mkdir -p "$CLANG_DIR"

          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_REV}/clang-r574158.tar.gz"

          echo "Downloading AOSP Clang r574158..."

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$URL" \
            -o "$RUNNER_TEMP/clang.tar.gz"

          echo "Checking archive..."

          test -s "$RUNNER_TEMP/clang.tar.gz"

          tar -tzf "$RUNNER_TEMP/clang.tar.gz" >/dev/null

          echo "Extracting..."

          tar -xzf "$RUNNER_TEMP/clang.tar.gz" \
            -C "$CLANG_DIR"

          # Important: update PATH immediately
          export PATH="$CLANG_BIN:$PATH"

          # Also expose it to subsequent Actions steps
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "===== Compiler location ====="

          which clang

          echo "===== Compiler version ====="

          "$CLANG_BIN/clang" --version

          echo "===== Verify compiler ====="

          "$CLANG_BIN/clang" --version \
            | grep -F "21.0.0"

          test -x "$CLANG_BIN/ld.lld"

          "$CLANG_BIN/ld.lld" --version

          echo "AOSP Clang r574158 installation successful!"

      # 5. Integrate SukiSU Nova builtin
      - name: Integrate SukiSU Nova
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          curl -fLSs \
            "https://git.zako.shirkneko.top:20004/shirkneko/SukiSU/raw/branch/main/kernel/setup.sh" \
            -o "$RUNNER_TEMP/sukisu-setup.sh"

          bash "$RUNNER_TEMP/sukisu-setup.sh" builtin

          echo "===== SukiSU directory ====="
          ls -ld drivers/kernelsu

          echo "===== Resolved directory ====="
          readlink -f drivers/kernelsu

          echo "===== Git remote ====="
          git -C drivers/kernelsu remote -v

          echo "===== Git branch ====="
          git -C drivers/kernelsu branch --show-current

          echo "===== Git commit ====="
          git -C drivers/kernelsu rev-parse HEAD

          echo "===== Kconfig files ====="
          find -L drivers/kernelsu \
            -iname '*kconfig*' -type f

          echo "===== Hook configuration search ====="

          grep -RniE \
            'KSU_HACK_ARM64_BRANCH_LINK|KSU_TAMPER_SYSCALL_TABLE|config KSU' \
            drivers/kernelsu \
            --include='Kconfig*' || true

          echo "===== Hook function declarations ====="

          echo "===== SukiSU Hook headers ====="
          find -L drivers/kernelsu \
            -type f \
            \( -name '*.h' -o -name '*.c' \) \
            | sort | head -100

            echo "===== SukiSU Hook declarations ====="

          grep -RniE \
            'ksu_handle_execveat|ksu_handle_faccessat|ksu_handle_stat|ksu_handle_newfstat_ret|ksu_handle_sys_reboot|ksu_handle_kernel_umount' \
            drivers/kernelsu \
            --include='*.h' \
            --include='*.c' || true

          echo "===== Kernel execve functions ====="

          grep -nE \
            'do_execveat_common|do_execve_common' \
            fs/exec.c

          echo "===== Kernel faccessat functions ====="

          grep -nE \
            'SYSCALL_DEFINE.*faccessat|do_faccessat' \
            fs/open.c

          echo "===== Kernel stat functions ====="

          grep -nE \
            'SYSCALL_DEFINE.*newfstat|SYSCALL_DEFINE.*fstat|cp_new_stat' \
            fs/stat.c

          echo "===== Kernel reboot functions ====="

          grep -nE \
            'SYSCALL_DEFINE.*reboot' \
            kernel/reboot.c

          echo "===== Android 16 stat return context ====="

          grep -n -A18 -B5 \
            'SYSCALL_DEFINE2(newfstat' \
            fs/stat.c || true

          echo "SukiSU source inspection completed."

          echo "===== Linux 4.19 SukiSU builtin compatibility ====="
          KSU_DIR="$(readlink -f drivers/kernelsu)"
          KSU_INCLUDES="$KSU_DIR/kernel_includes.h"

          test -s "$KSU_INCLUDES"

          if grep -q '^#include <linux/static_call.h>' "$KSU_INCLUDES" \
             && [ ! -f include/linux/static_call.h ]; then
            if ! awk '
              /^#include <linux\/static_call.h>/ {
                if (prev ~ /KERNEL_VERSION\(5, 10, 0\)/) guarded=1
              }
              { prev=$0 }
              END { exit !guarded }
            ' "$KSU_INCLUDES"; then
              echo "Adding Linux 5.10+ guard for static_call.h (not present in Linux 4.19)"
              sed -i 's|^#include <linux/static_call.h>|#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n#include <linux/static_call.h>\n#endif|' "$KSU_INCLUDES"
            fi
          fi

          if [ ! -f include/linux/static_call.h ]; then
            if grep -q '^#include <linux/static_call.h>' "$KSU_INCLUDES"; then
              awk '
                /^#include <linux\/static_call.h>/ && prev !~ /KERNEL_VERSION\(5, 10, 0\)/ { bad=1 }
                { prev=$0 }
                END { exit bad ? 1 : 0 }
              ' "$KSU_INCLUDES" || {
                echo "::error::Unprotected static_call.h include remains for Linux 4.19"
                exit 1
              }
            fi
          fi

          echo "Linux 4.19 static_call header compatibility check passed."

          echo "===== Disable optional SUSFS header dependency ====="
          if grep -q '^#include <linux/susfs.h>' "$KSU_INCLUDES"; then
            sed -i 's|^#include <linux/susfs.h>|#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif|' "$KSU_INCLUDES"
          fi

          if [ ! -f include/linux/susfs.h ] && grep -q '^#include <linux/susfs.h>' "$KSU_INCLUDES"; then
            awk '
              /^#include <linux\/susfs.h>/ && prev !~ /^#ifdef CONFIG_KSU_SUSFS$/ { bad=1 }
              { prev=$0 }
              END { exit bad ? 1 : 0 }
            ' "$KSU_INCLUDES" || {
              echo "::error::Unprotected SUSFS header include remains while SUSFS is disabled"
              exit 1
            }
          fi
          echo "SUSFS header is conditional; SUSFS remains disabled."

          echo "========== A. SukiSU sucompat.h =========="
          sed -n '1,100p' drivers/kernelsu/feature/sucompat.h

          echo "========== B. SukiSU sucompat.c =========="
          sed -n '90,230p' drivers/kernelsu/feature/sucompat.c

          echo "========== C. SukiSU sys_reboot handler =========="
          sed -n '110,165p' drivers/kernelsu/supercall/supercall.c
          sed -n '390,445p' drivers/kernelsu/supercall/dispatch.c

          echo "========== D. Kernel exec.c =========="
          sed -n '1870,1975p' fs/exec.c

          echo "========== E. Kernel open.c =========="
          sed -n '330,475p' fs/open.c

          echo "========== F. Kernel stat.c =========="
          sed -n '250,390p' fs/stat.c

          echo "========== G. Kernel reboot.c =========="
          sed -n '285,340p' kernel/reboot.c

          echo "========== H. Search newfstat return hooks =========="
          grep -RniE \
            'newfstat_ret|fstat.*ret|handle_stat' \
            drivers/kernelsu \
            --include='*.h' \
            --include='*.c' || true

          echo "========== I. Search all SukiSU hook symbols =========="
          grep -RniE 'ksu_handle_newfstat_ret|ksu_handle_post_execveat|ksu_handle_sys_reboot|ksu_handle_faccessat|ksu_handle_stat' drivers/kernelsu --include='*.h' --include='*.c' || true

          echo "========== J. Check getname in open.c =========="
          grep -n -A12 -B8 'getname' fs/open.c

          echo "========== K. Check stat syscall definitions =========="
          grep -n -A18 -B5 'SYSCALL_DEFINE4(newfstatat' fs/stat.c
          grep -n -A18 -B5 'SYSCALL_DEFINE2(newfstat' fs/stat.c

          echo "========== L. Check execve hook declarations =========="
          grep -Rni 'ksu_handle_post_execveat' drivers/kernelsu --include='*.h' --include='*.c' || true

          echo "========== M. user_path_at implementation =========="
          grep -Rni -A25 -B8 'int user_path_at\|user_path_at_empty' fs namei.c include/linux --include='*.c' --include='*.h' 2>/dev/null || true

          echo "========== N. SukiSU sucompat.c compatibility section =========="
          sed -n '220,330p' drivers/kernelsu/feature/sucompat.c

          echo "========== O. SukiSU reboot declarations and callers =========="
          grep -Rni -A12 -B8 'ksu_handle_sys_reboot' drivers/kernelsu --include='*.c' --include='*.h'

          echo "========== P. Kernel reboot syscall full body =========="
          sed -n '308,410p' kernel/reboot.c

          echo "========== Q. Kernel syscall headers =========="
          grep -n -E 'linux/.*ksu|ksu' fs/exec.c fs/open.c fs/stat.c kernel/reboot.c || true

      # 6. Configure kernel      
      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          mkdir -p out

          make O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/kona-perf_defconfig

          scripts/kconfig/merge_config.sh \
            -m -O out \
            out/.config \
            arch/arm64/configs/vendor/oplus.config

          echo "===== Search ARM64 branch link option ====="

          grep -Rni \
            "KSU_HACK_ARM64_BRANCH_LINK" \
            . \
            --exclude-dir=.git \
            --exclude-dir=out || true

          echo "===== SukiSU Kconfig ====="

          find drivers/kernelsu \
            -iname '*kconfig*' -type f

          echo "===== SukiSU hooks ====="

          grep -RniE \
            'ksu_handle_execveat|ksu_handle_faccessat|ksu_handle_stat|ksu_handle_newfstat_ret|ksu_handle_sys_reboot' \
            drivers/kernelsu \
            --include='*.h' || true

          echo "===== Enable SukiSU Nova (SUSFS temporarily disabled) ====="

          scripts/config --file out/.config \
            --enable KSU \
            --disable KSU_SUSFS

          echo "===== Resolve kernel configuration ====="

          make O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "===== Verify required configuration ====="

          grep -E '^CONFIG_KSU=' out/.config

          grep -qx 'CONFIG_KSU=y' out/.config || {
            echo "::error::CONFIG_KSU is not enabled after olddefconfig"
            exit 1
          }

          echo "===== Verify SukiSU source link ====="
          test -L drivers/kernelsu
          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig || find -L drivers/kernelsu -maxdepth 3 -iname 'Kconfig*' -type f -print

          echo "===== Compiler selected for build ====="
          command -v clang
          clang --version | head -n 1

          echo "SukiSU Nova configuration validation passed (SUSFS intentionally disabled)."

      # 7. Build kernel
      - name: Build kernel
        run: |
          cd kernel

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image dtbs

      # 8. Collect artifacts
      - name: Collect artifacts
        run: |
          cd kernel

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp out/arch/arm64/boot/Image \
            "$GITHUB_WORKSPACE/artifacts/Image"

          cp out/.config \
            "$GITHUB_WORKSPACE/artifacts/kernel.config"

          make -s O=out ARCH=arm64 kernelrelease \
            > "$GITHUB_WORKSPACE/artifacts/kernel-version.txt"

          git rev-parse HEAD \
            > "$GITHUB_WORKSPACE/artifacts/kernel-commit.txt"

          clang --version \
            > "$GITHUB_WORKSPACE/artifacts/clang-version.txt"

          tar -czf \
            "$GITHUB_WORKSPACE/artifacts/dtbs.tar.gz" \
            -C out/arch/arm64/boot/dts .

          cd "$GITHUB_WORKSPACE/artifacts"

          sha256sum Image > SHA256SUMS.txt

      # 9. Upload artifacts
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lemonades-SukiSU-Nova-4.19
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
